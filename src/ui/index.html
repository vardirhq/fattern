<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fattern</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ── Theme detection: run before paint to avoid flash ── -->
    <script>
      (function () {
        var DARK_THEMES = { dark: 1, midnight: 1 };
        var saved = localStorage.getItem('fattern:theme');
        if (saved && DARK_THEMES[saved]) {
          document.documentElement.setAttribute('data-loading-theme', 'dark');
        }
      })();
    </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { margin: 0; padding: 0; overflow: hidden; background: #F4F2EC; }
      [data-loading-theme="dark"] body { background: #121417; }

      /* ── Loading screen ── */
      #loading-screen {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; overflow: hidden;
        font-family: 'Inter', system-ui, sans-serif;
        opacity: 1;
        transition: opacity 0.35s ease;
        /* Paper (light) defaults */
        --ls-bg:          #F4F2EC;
        --ls-ink:         #15171A;
        --ls-soft:        #4A4F57;
        --ls-tile:        #15171A;
        --ls-tile-ink:    #F4F2EC;
        --ls-bar-track:   #E3DFD5;
        --ls-bar-fill:    #15171A;
        background: var(--ls-bg);
      }

      /* Ink (dark) override */
      [data-loading-theme="dark"] #loading-screen {
        --ls-bg:          #121417;
        --ls-ink:         #F4F2EC;
        --ls-soft:        rgba(244,242,236,0.70);
        --ls-tile:        #F4F2EC;
        --ls-tile-ink:    #15171A;
        --ls-bar-track:   rgba(244,242,236,0.12);
        --ls-bar-fill:    #F4F2EC;
      }

      #loading-screen.fade-out { opacity: 0; pointer-events: none; }

      #ls-titlebar {
        height: 40px; flex-shrink: 0;
        -webkit-app-region: drag;
      }

      #ls-content {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding-bottom: 40px;
      }

      #ls-mark { display: block; animation: lsNod 2.4s ease-in-out infinite; }
      #ls-mark .tile { fill: var(--ls-tile); }
      #ls-mark .ink  { fill: var(--ls-tile-ink); stroke: var(--ls-tile-ink); }
      /* A small, friendly nod of the moustache */
      #ls-mark .moustache { transform-origin: 29px 32px; animation: lsTwitch 2.4s ease-in-out infinite; }
      @keyframes lsNod     { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes lsTwitch  { 0%, 40%, 100% { transform: rotate(0deg); } 48% { transform: rotate(-4deg); } 56% { transform: rotate(3deg); } 64% { transform: rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) {
        #ls-mark, #ls-mark .moustache { animation: none; }
      }

      #ls-wordmark {
        margin-top: 22px;
        font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
        font-weight: 600; font-size: 34px; letter-spacing: -0.035em; line-height: 1;
        color: var(--ls-ink);
      }
      #ls-tagline {
        margin-top: 8px;
        font-size: 14px;
        color: var(--ls-soft);
      }

      #ls-progress { margin-top: 36px; width: 180px; }
      #ls-bar-track {
        height: 3px; border-radius: 2px;
        background: var(--ls-bar-track);
        overflow: hidden;
      }
      #ls-bar-fill {
        height: 100%; width: 0%; border-radius: 2px;
        background: var(--ls-bar-fill);
        transition: width 0.18s ease;
      }
      #ls-label {
        margin-top: 10px; text-align: center;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--ls-soft);
      }

      /* Root hidden until React takes over */
      #root { display: none; opacity: 0; transition: opacity 0.25s ease; }
      #root.ready { display: block; }
      #root.visible { opacity: 1; }
    </style>
  </head>

  <body class="bg-cloud text-ink">

    <div id="loading-screen" role="status" aria-label="Fattern starter">
      <div id="ls-titlebar"></div>

      <div id="ls-content">
        <svg id="ls-mark" width="88" height="88" viewBox="0 0 64 64" aria-hidden="true">
          <rect class="tile" width="64" height="64" rx="14" />
          <path class="ink" d="M29 54V26A11 11 0 0 1 40 15H45" stroke-width="7" fill="none" style="fill:none" />
          <path class="ink moustache" d="M29 30C26 27 21 27 18 30C16 32 13 32 11 30C12 35 17 38 22 37C25 36.5 27 35 29 33C31 35 33 36.5 36 37C41 38 46 35 47 30C45 32 42 32 40 30C37 27 32 27 29 30Z" stroke="none" />
          <circle cx="51" cy="51" r="3.5" fill="#2F4BD8" />
        </svg>
        <div id="ls-wordmark">fattern</div>
        <div id="ls-tagline">Fattern ordner det.</div>
        <div id="ls-progress">
          <div id="ls-bar-track">
            <div id="ls-bar-fill"></div>
          </div>
          <div id="ls-label">Initialiserer · 0%</div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      var progress  = 0;
      var barFill   = document.getElementById('ls-bar-fill');
      var label     = document.getElementById('ls-label');

      var ticker = setInterval(function () {
        progress = Math.min(progress + Math.random() * 14, 95);
        if (barFill) barFill.style.width = progress + '%';
        if (label)   label.textContent   = 'Initialiserer · ' + Math.round(progress) + '%';
      }, 160);

      window.hideLoadingScreen = function () {
        clearInterval(ticker);
        var screen = document.getElementById('loading-screen');
        var root   = document.getElementById('root');

        // Finish the bar
        if (barFill) barFill.style.width = '100%';
        if (label)   label.textContent   = 'Initialiserer · 100%';

        // Show root behind the fade
        if (root) root.classList.add('ready');

        setTimeout(function () {
          // Fade the loading screen out
          if (screen) {
            screen.classList.add('fade-out');
            screen.addEventListener('transitionend', function () {
              screen.style.display = 'none';
            }, { once: true });
          }
          // Fade the app in
          if (root) {
            requestAnimationFrame(function () {
              root.classList.add('visible');
            });
          }
        }, 120); // brief pause so 100% registers visually
      };
    </script>
  </body>
</html>
