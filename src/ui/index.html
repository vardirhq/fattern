<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fattern</title>

    <!-- ── Theme detection: run before paint to avoid flash ── -->
    <script>
      (function () {
        var DARK_THEMES = { dark: 1, midnight: 1 };
        var saved = localStorage.getItem('fattern:theme');
        if (saved && DARK_THEMES[saved]) {
          document.documentElement.setAttribute('data-loading-theme', 'dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { margin: 0; padding: 0; overflow: hidden; background: #F4F7F5; }
      [data-loading-theme="dark"] body { background: #0C1110; }

      /* ── Loading screen ── */
      #loading-screen {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; overflow: hidden;
        font-family: 'Hanken Grotesk Variable', system-ui, sans-serif;
        opacity: 1;
        transition: opacity 0.35s ease;
        /* Light defaults */
        --ls-bg:          #F4F7F5;
        --ls-ink:         #101816;
        --ls-soft:        #4D5C57;
        --ls-bar-track:   #DAE2DE;
        --ls-bar-fill:    #0C6A5B;
        background: var(--ls-bg);
      }

      /* Dark override */
      [data-loading-theme="dark"] #loading-screen {
        --ls-bg:          #0C1110;
        --ls-ink:         #ECF1EF;
        --ls-soft:        #A2B0AB;
        --ls-bar-track:   #26302D;
        --ls-bar-fill:    #45C9A5;
      }

      #loading-screen.fade-out { opacity: 0; pointer-events: none; }

      #ls-titlebar {
        height: 40px; flex-shrink: 0;
        -webkit-app-region: drag;
      }

      #ls-content {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding-bottom: 40px;
      }

      #ls-mark { display: block; }
      /* A small, friendly twitch of the moustache */
      #ls-mark .moustache { transform-origin: 30.5px 31px; animation: lsTwitch 2.4s ease-in-out infinite; }
      @keyframes lsTwitch  { 0%, 40%, 100% { transform: rotate(0deg); } 48% { transform: rotate(-4deg); } 56% { transform: rotate(3deg); } 64% { transform: rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) {
        #ls-mark .moustache { animation: none; }
      }

      #ls-wordmark {
        margin-top: 22px;
        font-family: 'Schibsted Grotesk Variable', 'Hanken Grotesk Variable', system-ui, sans-serif;
        font-weight: 700; font-size: 34px; letter-spacing: -0.03em; line-height: 1;
        color: var(--ls-ink);
      }
      #ls-tagline {
        margin-top: 8px;
        font-size: 14px;
        color: var(--ls-soft);
      }

      #ls-progress { margin-top: 36px; width: 180px; }
      #ls-bar-track {
        height: 3px; border-radius: 2px;
        background: var(--ls-bar-track);
        overflow: hidden;
      }
      #ls-bar-fill {
        height: 100%; width: 0%; border-radius: 2px;
        background: var(--ls-bar-fill);
        transition: width 0.18s ease;
      }
      #ls-label {
        margin-top: 10px; text-align: center;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--ls-soft);
      }

      /* Root hidden until React takes over */
      #root { display: none; opacity: 0; transition: opacity 0.25s ease; }
      #root.ready { display: block; }
      #root.visible { opacity: 1; }
    </style>
  </head>

  <body>

    <div id="loading-screen" role="status" aria-label="Fattern starter">
      <div id="ls-titlebar"></div>

      <div id="ls-content">
        <svg id="ls-mark" width="88" height="88" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#0C6A5B" />
          <mask id="ls-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
            <rect width="64" height="64" fill="#fff" />
            <path d="M30.50 28.60C27.50 24.80 21.00 24.40 18.00 27.60C15.90 29.80 14.50 32.60 13.50 37.00C17.50 39.20 23.50 38.80 27.50 36.00C28.90 35.00 29.90 34.60 30.50 34.60ZM30.50 28.60C33.50 24.80 40.00 24.40 43.00 27.60C45.10 29.80 46.50 32.60 47.50 37.00C43.50 39.20 37.50 38.80 33.50 36.00C32.10 35.00 31.10 34.60 30.50 34.60Z" fill="#000" stroke="#000" stroke-width="4.4" stroke-linejoin="round" />
          </mask>
          <g fill="#FFFFFF" mask="url(#ls-mask)">
            <rect x="26" y="13" width="9" height="39" rx="1.5" />
            <rect x="26" y="13" width="23" height="9" rx="1.5" />
          </g>
          <path class="moustache" d="M30.50 28.60C27.50 24.80 21.00 24.40 18.00 27.60C15.90 29.80 14.50 32.60 13.50 37.00C17.50 39.20 23.50 38.80 27.50 36.00C28.90 35.00 29.90 34.60 30.50 34.60ZM30.50 28.60C33.50 24.80 40.00 24.40 43.00 27.60C45.10 29.80 46.50 32.60 47.50 37.00C43.50 39.20 37.50 38.80 33.50 36.00C32.10 35.00 31.10 34.60 30.50 34.60Z" fill="#F0B03A" />
        </svg>
        <div id="ls-wordmark">Fattern</div>
        <div id="ls-tagline">Fattern ordner det.</div>
        <div id="ls-progress">
          <div id="ls-bar-track">
            <div id="ls-bar-fill"></div>
          </div>
          <div id="ls-label">Initialiserer · 0%</div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      var progress  = 0;
      var barFill   = document.getElementById('ls-bar-fill');
      var label     = document.getElementById('ls-label');

      var ticker = setInterval(function () {
        progress = Math.min(progress + Math.random() * 14, 95);
        if (barFill) barFill.style.width = progress + '%';
        if (label)   label.textContent   = 'Initialiserer · ' + Math.round(progress) + '%';
      }, 160);

      window.hideLoadingScreen = function () {
        clearInterval(ticker);
        var screen = document.getElementById('loading-screen');
        var root   = document.getElementById('root');

        // Finish the bar
        if (barFill) barFill.style.width = '100%';
        if (label)   label.textContent   = 'Initialiserer · 100%';

        // Show root behind the fade
        if (root) root.classList.add('ready');

        setTimeout(function () {
          // Fade the loading screen out
          if (screen) {
            screen.classList.add('fade-out');
            screen.addEventListener('transitionend', function () {
              screen.style.display = 'none';
            }, { once: true });
          }
          // Fade the app in
          if (root) {
            requestAnimationFrame(function () {
              root.classList.add('visible');
            });
          }
        }, 120); // brief pause so 100% registers visually
      };
    </script>
  </body>
</html>
